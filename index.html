<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>読譜トレーニング</title>
<style>
:root{--ink:#111827;--muted:#6b7280;--border:#d1d5db;--orange:#f59e0b;--blue:#2563eb;--ok:#15803d;--ng:#b91c1c}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Yu Gothic",sans-serif}
#sr-app{width:min(736px,94vw);margin:24px auto}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.clefs{display:flex;gap:8px}.clef{width:64px;height:52px;border:2px solid var(--border);border-radius:12px;background:#fff;font-size:36px;line-height:1;cursor:pointer;font-family:"Noto Music","Bravura","Segoe UI Symbol",serif}.mixed-clef{overflow:hidden;display:inline-flex;align-items:center;justify-content:center;padding-top:0;padding-bottom:0}.mixed-symbols{display:inline-flex;align-items:center;justify-content:center;gap:2px;font-size:22px;line-height:1;white-space:nowrap;transform:translateY(-1px)}.clef.active{border-color:var(--blue);background:#eff6ff}
.score{font-size:14px;font-weight:700}.sheet{overflow-x:auto;border:1px solid var(--border);border-radius:12px}
svg{display:block;width:100%;min-width:560px}.note{fill:#111827;stroke:#111827;stroke-width:2}.note.selected{fill:var(--orange);stroke:#d97706;stroke-width:3}.num{font-size:16px;fill:var(--muted)}
.questions{margin-top:16px}.keyboard-panel{border:1px solid var(--border);border-radius:12px;padding:12px}.keyboard-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}.keyboard-title{font-weight:700}.answer-progress{font-size:14px;color:var(--muted);font-weight:700}.keyboard-scroll{overflow:hidden;padding-bottom:4px;width:100%}.piano{position:relative;height:142px;width:100%;min-width:0;user-select:none}.white-key{position:absolute;top:0;height:140px;border:1px solid #9ca3af;border-radius:0 0 6px 6px;background:#fff;color:#111827;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;font-weight:700;font-size:clamp(7px,1.4vw,12px);overflow:hidden}.white-key:hover{background:#f9fafb}.white-key.pressed{background:#fde68a}.c4-marker{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:9px;height:9px;border-radius:50%;background:#dc2626;pointer-events:none}.black-key{position:absolute;top:0;height:86px;border:1px solid #111827;border-radius:0 0 5px 5px;background:#111827;z-index:2;pointer-events:none}.results-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}.result{min-height:34px;border:1px solid var(--border);border-radius:8px;padding:7px 8px;font-weight:700;font-size:13px;text-align:center}.result.pending{color:var(--muted)}.ok{color:var(--ok)}.ng{color:var(--ng)}
.range-picker{display:none;margin:12px 0 0;border:1px solid var(--border);border-radius:12px}.range-picker.show{display:block}.range-details{border:0}.range-summary{padding:11px 12px;font-weight:700;cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px}.range-summary::-webkit-details-marker{display:none}.range-summary::after{content:'▼';font-size:12px;color:var(--muted);transition:transform .15s ease}.range-details[open]>.range-summary::after{transform:rotate(180deg)}.range-picker-body{padding:0 12px 12px}.range-picker-head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}.range-picker-title{font-weight:700}.range-picker-info{font-size:13px;color:var(--muted);font-weight:700}.range-piano{position:relative;height:118px;width:100%;user-select:none}.range-white{position:absolute;top:0;height:116px;border:1px solid #9ca3af;border-radius:0 0 5px 5px;background:#fff;color:#111827;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;font-weight:700;font-size:clamp(7px,1.3vw,11px);overflow:hidden}.range-white.selected-edge{background:#bfdbfe;border-color:#2563eb}.range-white.in-range{background:#dbeafe}.range-black{position:absolute;top:0;height:70px;border:1px solid #111827;border-radius:0 0 4px 4px;background:#111827;z-index:2;pointer-events:none}.actions{display:flex;justify-content:center;margin-top:16px}.action{padding:12px 20px;border:0;border-radius:11px;background:var(--blue);color:#fff;font-weight:700;font-size:16px;cursor:pointer}.action:disabled{opacity:.4;cursor:not-allowed}.status{text-align:center;color:var(--muted);font-size:14px;margin-top:8px}
@media(max-width:520px){.keyboard-panel{padding:10px}.piano{height:132px}.white-key{height:130px}.black-key{height:80px}.results-row{gap:5px}.result{font-size:12px;padding:6px 4px}}

.solfege-choices{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px;margin-top:10px}.solfege-key{min-height:48px;border:1px solid var(--border);border-radius:9px;background:#fff;font-weight:700;font-size:16px;cursor:pointer}.solfege-key.pressed{background:#fde68a;border-color:#d97706}#celebrationLayer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9999;display:flex;align-items:center;justify-content:center}.celebration-image{width:min(320px,70vw);max-width:320px;opacity:0;animation:celebrateImage 2s ease-in-out forwards;filter:drop-shadow(0 12px 24px rgba(0,0,0,.18))}@keyframes celebrateImage{0%{opacity:0;transform:scale(.82)}12%{opacity:1;transform:scale(1)}82%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.05)}}
.time-mode-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0 2px}.time-mode-label{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700}.time-mode-label select{padding:8px 9px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--ink);font-weight:700}.time-attack-panel{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 10px;border:1px solid var(--border);border-radius:10px;background:#fff;font-size:14px;font-weight:700}.time-attack-panel[hidden]{display:none}.time-attack-panel button{padding:7px 12px;border:1px solid var(--border);border-radius:8px;background:#fff;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<main id="sr-app">
<div class="top">
<div class="clefs"><button id="treble" type="button" class="clef active" aria-label="ト音記号">𝄞</button><button id="bass" type="button" class="clef" aria-label="ヘ音記号">𝄢</button><button id="mixed" type="button" class="clef mixed-clef" aria-label="ト音記号とヘ音記号を混在"><span class="mixed-symbols">𝄞&nbsp;𝄢</span></button><label for="rangeSelect" style="display:flex;align-items:center;gap:6px;margin-left:6px;font-size:14px;font-weight:700;white-space:nowrap">音域<select id="rangeSelect" style="padding:8px 9px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--ink);font-weight:700"></select></label><label for="answerType" style="display:flex;align-items:center;gap:6px;margin-left:6px;font-size:14px;font-weight:700;white-space:nowrap">選択肢<select id="answerType" style="padding:8px 9px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--ink);font-weight:700"><option value="keyboard" selected>鍵盤</option><option value="rangeKeyboard">出題範囲の鍵盤</option><option value="solfege">ドレミファソラシ</option></select></label></div>
<div class="score">正解数：<span id="score">0</span> / <span id="total">0</span> <button id="resetScore" type="button" style="margin-left:8px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:#fff;font-weight:700;cursor:pointer">リセット</button></div>
</div>
<div class="time-mode-row">
<label for="modeSelect" class="time-mode-label">モード
<select id="modeSelect"><option value="normal" selected>通常</option><option value="timeAttack">2分タイムアタック</option></select>
</label>
<div id="timeAttackPanel" class="time-attack-panel" hidden>
<span>残り時間：<strong id="taTimer">3:00</strong></span>
<span>得点：<strong id="taScore">0</strong>問</span>
<button id="taStart" type="button">スタート</button>
</div>
</div>
<div id="rangePicker" class="range-picker" aria-live="polite"><details id="rangeDetails" class="range-details"><summary class="range-summary">鍵盤で出題範囲を選択</summary><div class="range-picker-body"><div class="range-picker-head"><div class="range-picker-title">範囲の両端を順に選択</div><div id="rangePickerInfo" class="range-picker-info">1つ目の音を選んでください</div></div><div id="rangePiano" class="range-piano"></div></div></details></div>
<div class="sheet">
<svg id="staffSvg" viewBox="0 0 720 250" aria-label="読譜問題">
<g stroke="#111827" stroke-width="2"><line x1="70" y1="70" x2="660" y2="70"/><line x1="70" y1="94" x2="660" y2="94"/><line x1="70" y1="118" x2="660" y2="118"/><line x1="70" y1="142" x2="660" y2="142"/><line x1="70" y1="166" x2="660" y2="166"/></g>
<text id="clefSymbol" x="82" y="160" font-size="108" font-family="Noto Music,Bravura,Segoe UI Symbol,serif">𝄞</text>
<g id="ledger0" stroke="#111827" stroke-width="2"></g><g id="ledger1" stroke="#111827" stroke-width="2"></g><g id="ledger2" stroke="#111827" stroke-width="2"></g>
<ellipse id="n0" class="note" cx="260" cy="118" rx="17" ry="11" transform="rotate(-12 260 118)"/><ellipse id="n1" class="note" cx="335" cy="142" rx="17" ry="11" transform="rotate(-12 335 142)"/><ellipse id="n2" class="note" cx="410" cy="94" rx="17" ry="11" transform="rotate(-12 410 94)"/>

</svg>
</div>
<div id="questions" class="questions"></div>
<div class="actions"><button id="correctBtn" type="button" class="action" disabled style="background:#fff;color:var(--ink);border:1px solid var(--border);margin-right:8px">修正</button><button id="action" type="button" class="action" disabled>答え合わせ</button></div>
<p id="status" class="status">3つすべて選ぶと答え合わせできます。</p>
</main>
<script>
(function(){
const root=document.getElementById('sr-app'),names=['ド','レ','ミ','ファ','ソ','ラ','シ'],letters=['C','D','E','F','G','A','B'],jp={C:'ド',D:'レ',E:'ミ',F:'ファ',G:'ソ',A:'ラ',B:'シ'},xs=[260,335,410];
let clef='treble',clefMode='treble',answers=[null,null,null],problem=[],checked=false,score=0,total=0,lastCelebrationMilestone=0,difficulty='t1',rangeChoice={treble:'t1',bass:'b1'},customRanges={treble:{from:'C4',to:'G4'},bass:{from:'C4',to:'F3'}},rangePickStart=null,gameMode='normal',timeAttackRunning=false,timeAttackSeconds=120,timeAttackScore=0,timeAttackTimer=null;
const qwrap=document.getElementById('questions'),action=document.getElementById('action'),correctBtn=document.getElementById('correctBtn'),status=document.getElementById('status'),modeSelect=document.getElementById('modeSelect'),timeAttackPanel=document.getElementById('timeAttackPanel'),taTimer=document.getElementById('taTimer'),taScoreEl=document.getElementById('taScore'),taStart=document.getElementById('taStart');
function idx(l,o){return o*7+letters.indexOf(l)} function base(){return clef==='treble'?idx('E',4):idx('G',2)}
function pitch(pos){
const n=base()+pos,li=((n%7)+7)%7,octave=Math.floor(n/7),letter=letters[li];
return{pos:pos,name:jp[letter],letter:letter,octave:octave}
}
function y(pos){return 166-pos*12}

let audioCtx=null;
function frequencyFor(note){
const semitone={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[note.letter];
const midi=(note.octave+1)*12+semitone;
return 440*Math.pow(2,(midi-69)/12);
}
function playNote(note,delay){
try{
if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
if(audioCtx.state==='suspended') audioCtx.resume();
const start=audioCtx.currentTime+(delay||0);
const f=frequencyFor(note);
const master=audioCtx.createGain();
master.gain.setValueAtTime(0.0001,start);
master.gain.exponentialRampToValueAtTime(0.42,start+0.008);
master.gain.exponentialRampToValueAtTime(0.11,start+0.18);
master.gain.exponentialRampToValueAtTime(0.0001,start+1.15);
master.connect(audioCtx.destination);

const harmonics=[
  [1.00,0.75],
  [2.00,0.24],
  [3.00,0.12],
  [4.00,0.07],
  [5.00,0.035]
];
harmonics.forEach(function(h){
  const osc=audioCtx.createOscillator();
  const g=audioCtx.createGain();
  osc.type='sine';
  osc.frequency.setValueAtTime(f*h[0],start);
  g.gain.setValueAtTime(h[1],start);
  osc.connect(g);
  g.connect(master);
  osc.start(start);
  osc.stop(start+1.18);
});
}catch(e){}
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function line(g,x,yy){const e=document.createElementNS('http://www.w3.org/2000/svg','line');e.setAttribute('x1',x-27);e.setAttribute('x2',x+27);e.setAttribute('y1',yy);e.setAttribute('y2',yy);g.appendChild(e)}
function place(i,pos){const n=document.getElementById('n'+i),yy=y(pos);n.setAttribute('cy',yy);n.setAttribute('transform','rotate(-12 '+xs[i]+' '+yy+')');const g=document.getElementById('ledger'+i);g.textContent='';if(pos<=-2)for(let p=-2;p>=pos;p-=2)line(g,xs[i],y(p));if(pos>=10)for(let p=10;p<=pos;p+=2)line(g,xs[i],y(p))}
function noteLabel(note){return note.letter+note.octave}
function midiNumber(letter,octave){
const semitone={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[letter];
return (octave+1)*12+semitone;
}
function noteFromMidi(midi){
const pcs=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const pc=pcs[((midi%12)+12)%12],octave=Math.floor(midi/12)-1;
return{pc:pc,letter:pc.charAt(0),octave:octave,midi:midi,isBlack:pc.indexOf('#')!==-1};
}
function renderSolfege(){
qwrap.innerHTML='';
const panel=document.createElement('section');panel.className='keyboard-panel';
const head=document.createElement('div');head.className='keyboard-head';
const title=document.createElement('div');title.className='keyboard-title';title.textContent='ドレミファソラシで3つ続けて答えてください';
const progress=document.createElement('div');progress.id='answerProgress';progress.className='answer-progress';progress.textContent='1音目を選択';
head.appendChild(title);head.appendChild(progress);panel.appendChild(head);
const choices=document.createElement('div');choices.className='solfege-choices';
['ド','レ','ミ','ファ','ソ','ラ','シ'].forEach(function(name){
 const b=document.createElement('button');b.type='button';b.className='solfege-key';b.textContent=name;
 b.addEventListener('click',function(){selectSolfege(name,b);});choices.appendChild(b);
});
panel.appendChild(choices);
const results=document.createElement('div');results.className='results-row';
for(let i=0;i<3;i++){const r=document.createElement('div');r.id='r'+i;r.className='result pending';r.textContent=(i+1)+'音目：未選択';results.appendChild(r);}
panel.appendChild(results);qwrap.appendChild(panel);
}
function selectSolfege(name,key){
if(checked||(gameMode==='timeAttack'&&!timeAttackRunning))return;
let i=answers.filter(function(v){return v!==null;}).length;if(i>=3)return;
answers[i]={type:'solfege',name:name};
document.getElementById('n'+i).classList.add('selected');correctBtn.disabled=false;
const r=document.getElementById('r'+i);r.textContent=(i+1)+'音目：'+name;r.className='result';
key.classList.add('pressed');setTimeout(function(){key.classList.remove('pressed');},180);
i++;const progress=document.getElementById('answerProgress');
if(i<3){progress.textContent=(i+1)+'音目を選択';status.textContent=(i+1)+'音目を選んでください。';}
else{progress.textContent='3音選択済み';action.disabled=false;status.textContent='3つ選択済みです。答え合わせできます。';}
}
function render(){if(answerType==='solfege'){renderSolfege();return;}
qwrap.innerHTML='';
const panel=document.createElement('section');panel.className='keyboard-panel';
const head=document.createElement('div');head.className='keyboard-head';
const title=document.createElement('div');title.className='keyboard-title';title.textContent=answerType==='rangeKeyboard'?'出題範囲の鍵盤で3つ続けて答えてください':'鍵盤で3つ続けて答えてください';
const progress=document.createElement('div');progress.id='answerProgress';progress.className='answer-progress';progress.textContent='1音目を選択';
head.appendChild(title);head.appendChild(progress);panel.appendChild(head);

const scroll=document.createElement('div');scroll.className='keyboard-scroll';
const piano=document.createElement('div');piano.className='piano';piano.id='pianoKeyboard';
const keyboardRange=answerType==='rangeKeyboard'?expandedRangeKeyboardConfig():rangeConfigs[clef][rangeConfigs[clef].length-1],fromMidi=midiNumber(keyboardRange.from.charAt(0),parseInt(keyboardRange.from.slice(1),10)),toMidi=midiNumber(keyboardRange.to.charAt(0),parseInt(keyboardRange.to.slice(1),10));
const low=Math.min(fromMidi,toMidi),high=Math.max(fromMidi,toMidi);
const notes=[];for(let m=low;m<=high;m++)notes.push(noteFromMidi(m));
const whiteNotes=notes.filter(function(n){return !n.isBlack;});
const whiteWidthPct=100/Math.max(whiteNotes.length,1);

let whiteIndex=0;
notes.forEach(function(n){
if(!n.isBlack){
  const key=document.createElement('button');
  key.type='button';key.className='white-key';key.style.left=(whiteIndex*whiteWidthPct)+'%';key.style.width=whiteWidthPct+'%';
  key.textContent=n.pc+n.octave;key.setAttribute('aria-label',n.pc+n.octave);
  if(n.pc==='C' && n.octave===4){
    const marker=document.createElement('span');
    marker.className='c4-marker';
    marker.setAttribute('aria-hidden','true');
    key.appendChild(marker);
  }
  key.addEventListener('click',function(){selectPiano(n,key);});
  piano.appendChild(key);whiteIndex++;
}
});
let seenWhites=0;
notes.forEach(function(n){
if(n.isBlack){
  const key=document.createElement('div');key.className='black-key';
  key.style.width=(whiteWidthPct*0.58)+'%';
  key.style.left=(seenWhites*whiteWidthPct-whiteWidthPct*0.29)+'%';
  piano.appendChild(key);
}else{seenWhites++;}
});
scroll.appendChild(piano);panel.appendChild(scroll);

const results=document.createElement('div');results.className='results-row';
for(let i=0;i<3;i++){const r=document.createElement('div');r.id='r'+i;r.className='result pending';r.textContent=(i+1)+'音目：未選択';results.appendChild(r);}
panel.appendChild(results);qwrap.appendChild(panel);
}
function selectPiano(note,key){
if(checked||(gameMode==='timeAttack'&&!timeAttackRunning))return;
let i=answers.filter(function(v){return v!==null;}).length;
if(i>=3)return;
playNote(note,0);
answers[i]={type:'pitch',letter:note.letter,octave:note.octave,name:jp[note.letter]};
document.getElementById('n'+i).classList.add('selected');correctBtn.disabled=false;
const r=document.getElementById('r'+i);r.textContent=(i+1)+'音目：'+jp[note.letter]+'（'+note.letter+note.octave+'）';r.className='result';
key.classList.add('pressed');setTimeout(function(){key.classList.remove('pressed');},180);
i++;
const progress=document.getElementById('answerProgress');
if(i<3){progress.textContent=(i+1)+'音目を選択';status.textContent=(i+1)+'音目を鍵盤から選んでください。';}
else{progress.textContent='3音選択済み';action.disabled=false;status.textContent='3つ選択済みです。答え合わせできます。';}
}
const rangeConfigs={
treble:[
  {id:'t1',label:'C4〜G4',from:'C4',to:'G4'},
  {id:'t2',label:'C4〜C5',from:'C4',to:'C5'},
  {id:'t3',label:'C4〜G5',from:'C4',to:'G5'},
  {id:'t4',label:'C4〜C6',from:'C4',to:'C6'},
  {id:'t5',label:'C5〜G6',from:'C5',to:'G6'},
  {id:'t6',label:'F3〜C4',from:'F3',to:'C4'},
  {id:'tAll',label:'上の全て（F3〜G6）',from:'F3',to:'G6'}
],
bass:[
  {id:'b1',label:'C4〜F3',from:'C4',to:'F3'},
  {id:'b2',label:'C4〜C3',from:'C4',to:'C3'},
  {id:'b3',label:'G3〜C3',from:'G3',to:'C3'},
  {id:'b4',label:'C4〜G2',from:'C4',to:'G2'},
  {id:'b5',label:'G2〜C1',from:'G2',to:'C1'},
  {id:'b6',label:'C4〜G4',from:'C4',to:'G4'},
  {id:'bAll',label:'上の全て（C1〜G4）',from:'C1',to:'G4'}
]};
function absoluteIndex(noteName){
const m=/^([A-G])(\d+)$/.exec(noteName);
return parseInt(m[2],10)*7+letters.indexOf(m[1]);
}
function positionsBetween(from,to){
const b=base(),a=absoluteIndex(from),z=absoluteIndex(to),lo=Math.min(a,z),hi=Math.max(a,z),out=[];
for(let n=lo;n<=hi;n++)out.push(n-b);
return out;
}
function currentRangeConfig(){
if(difficulty==='custom')return{id:'custom',label:'鍵盤で選択',from:customRanges[clef].from,to:customRanges[clef].to};
const list=rangeConfigs[clef];
return list.find(function(r){return r.id===difficulty;})||list[0];
}
function noteNameFromAbsoluteIndex(n){
const octave=Math.floor(n/7),letter=letters[((n%7)+7)%7];
return letter+octave;
}
function expandedRangeKeyboardConfig(){
const selected=currentRangeConfig(),full=rangeConfigs[clef][rangeConfigs[clef].length-1];
let lo=Math.min(absoluteIndex(selected.from),absoluteIndex(selected.to));
let hi=Math.max(absoluteIndex(selected.from),absoluteIndex(selected.to));
const fullLo=Math.min(absoluteIndex(full.from),absoluteIndex(full.to));
const fullHi=Math.max(absoluteIndex(full.from),absoluteIndex(full.to));
const minimumWhiteKeys=10;
let count=hi-lo+1;
if(count<minimumWhiteKeys){
  let need=minimumWhiteKeys-count;
  let below=Math.floor(need/2),above=need-below;
  lo-=below;hi+=above;
  if(lo<fullLo){hi+=fullLo-lo;lo=fullLo;}
  if(hi>fullHi){lo-=hi-fullHi;hi=fullHi;}

function playCelebrationMelody(){
try{
if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
if(audioCtx.state==='suspended') audioCtx.resume();
const notes=[
  {f:523.25,t:0.00,d:0.15},{f:659.25,t:0.16,d:0.15},
  {f:783.99,t:0.32,d:0.15},{f:1046.50,t:0.48,d:0.20},
  {f:783.99,t:0.72,d:0.13},{f:987.77,t:0.86,d:0.13},
  {f:1174.66,t:1.00,d:0.16},{f:1318.51,t:1.18,d:0.42}
];
const start=audioCtx.currentTime;
notes.forEach(function(n){
  const master=audioCtx.createGain();
  master.gain.setValueAtTime(0.0001,start+n.t);
  master.gain.exponentialRampToValueAtTime(0.20,start+n.t+0.008);
  master.gain.exponentialRampToValueAtTime(0.0001,start+n.t+n.d);
  master.connect(audioCtx.destination);

  const osc1=audioCtx.createOscillator();
  osc1.type='triangle';
  osc1.frequency.setValueAtTime(n.f,start+n.t);
  osc1.connect(master);
  osc1.start(start+n.t);
  osc1.stop(start+n.t+n.d+0.03);

  const osc2=audioCtx.createOscillator();
  const g2=audioCtx.createGain();
  osc2.type='sine';
  osc2.frequency.setValueAtTime(n.f*2,start+n.t);
  g2.gain.setValueAtTime(0.07,start+n.t);
  osc2.connect(g2);
  g2.connect(master);
  osc2.start(start+n.t);
  osc2.stop(start+n.t+n.d+0.03);
});
}catch(e){}
}

function grade(){
if(answers.some(function(v){return v===null;}))return;
let gain=0,playIndex=0;
for(let i=0;i<3;i++){
const r=document.getElementById('r'+i);
const correct=answers[i].type==='solfege'?answers[i].name===problem[i].name:(answers[i].letter===problem[i].letter&&answers[i].octave===problem[i].octave);
if(correct){
gain++;
r.textContent=(i+1)+'音目：○ 正解';
r.className='result ok';
}else{
r.textContent=(i+1)+'音目：× 正解は '+(answerType==='solfege'?problem[i].name:jp[problem[i].letter]+'（'+problem[i].letter+problem[i].octave+'）');
r.className='result ng';
}
}
if(gain===3){
for(let i=0;i<3;i++)playNote(problem[i],i*0.38);
}
if(gameMode==='timeAttack'){
timeAttackScore+=gain;
taScoreEl.textContent=timeAttackScore;
}else{
const previousScore=score;
score+=gain;
total+=3;
const previousMilestone=Math.floor(previousScore/30);
const currentMilestone=Math.floor(score/30);
if(currentMilestone>previousMilestone && currentMilestone>lastCelebrationMilestone){
lastCelebrationMilestone=currentMilestone;
setTimeout(celebrate30,1000);
}
document.getElementById('score').textContent=score;
document.getElementById('total').textContent=total;
}
checked=true;
correctBtn.disabled=true;
action.textContent='次の問題';
status.textContent=gain+' / 3 正解';
qwrap.querySelectorAll('.white-key,.solfege-key').forEach(function(b){b.disabled=true;});
}
function formatTime(sec){const m=Math.floor(sec/60),r=sec%60;return m+':'+String(r).padStart(2,'0');}
function stopTimeAttackTimer(){if(timeAttackTimer){clearInterval(timeAttackTimer);timeAttackTimer=null;}}
function playTimeUpAlarm(){
try{
if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
if(audioCtx.state==='suspended') audioCtx.resume();
const start=audioCtx.currentTime;
for(let i=0;i<4;i++){
  const t=start+i*0.22;
  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();
  osc.type='square';
  osc.frequency.setValueAtTime(1046.5,t);
  gain.gain.setValueAtTime(0.0001,t);
  gain.gain.exponentialRampToValueAtTime(0.16,t+0.008);
  gain.gain.exponentialRampToValueAtTime(0.0001,t+0.12);
  osc.connect(gain);gain.connect(audioCtx.destination);
  osc.start(t);osc.stop(t+0.13);
}
}catch(e){}
}
function finishTimeAttack(){
stopTimeAttackTimer();timeAttackRunning=false;timeAttackSeconds=0;taTimer.textContent='0:00';playTimeUpAlarm();
action.disabled=true;correctBtn.disabled=true;
qwrap.querySelectorAll('.white-key,.solfege-key').forEach(function(b){b.disabled=true;});
taStart.disabled=false;taStart.textContent='もう一度';
status.textContent='タイムアタック終了！ 正解数：'+timeAttackScore+'問';
}
function startTimeAttack(){
stopTimeAttackTimer();
gameMode='timeAttack';timeAttackRunning=true;timeAttackSeconds=120;timeAttackScore=0;lastCelebrationMilestone=0;
taTimer.textContent='2:00';taScoreEl.textContent='0';taStart.disabled=true;taStart.textContent='挑戦中';
next();
timeAttackTimer=setInterval(function(){
timeAttackSeconds--;
taTimer.textContent=formatTime(Math.max(0,timeAttackSeconds));
if(timeAttackSeconds<=0)finishTimeAttack();
},1000);
}
function setClef(c){
clefMode=c;
document.getElementById('treble').classList.toggle('active',c==='treble');
document.getElementById('bass').classList.toggle('active',c==='bass');
document.getElementById('mixed').classList.toggle('active',c==='mixed');
if(c!=='mixed'){
  clef=c;
  difficulty=rangeChoice[clef]||rangeConfigs[clef][0].id;
  applyClefVisual();
}
populateRangeSelect();
next();
}

if(checked)return;
const count=answers.filter(function(v){return v!==null;}).length;
if(count===0)return;
const i=count-1;
answers[i]=null;
